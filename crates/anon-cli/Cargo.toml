[package]
name = "anon-cli"
description = "reco-anon: command-line front end for reco-anonymize."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "reco-anon"
path = "src/main.rs"

[dependencies]
anon-model.workspace = true
anon-detect = { workspace = true, features = ["ort"] }
anon-io.workspace = true
anon-pipeline.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
clap.workspace = true
env_logger.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
anon-detect = { workspace = true, features = ["coreml"] }

[features]
cuda = ["anon-detect/cuda"]
load-dynamic = ["anon-detect/load-dynamic"]

[lints]
workspace = true
